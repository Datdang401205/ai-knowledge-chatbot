[project]
name = "ai-knowledge-chatbot"
version = "0.6.0"
description = "Chatbot hỏi đáp tài liệu với RAG: PDF ingestion, retrieval, citations, FastAPI và Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx>=0.27"]

[project.scripts]
chatbot = "chatbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
